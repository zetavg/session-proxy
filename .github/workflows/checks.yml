name: Checks
on:
  push:
    branches:
      - main
      - "**"
    paths-ignore:
      - "**/README.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop
    paths-ignore:
      - "**/README.md"
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Lint
        run: |
          npm run lint

